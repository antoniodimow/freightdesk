services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: freightdesk
      POSTGRES_PASSWORD: freightdesk
      POSTGRES_DB: freightdesk
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightdesk -d freightdesk"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
